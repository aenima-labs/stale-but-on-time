format_version: 4
id: async-recall-voice
version: 1.0.0
title: Asynchronous recall in a live conversation (spoken)
description: 'Recall when asked, recall unprompted, and abstention, each after a scripted two-utterance
  lead-in that either continues or abruptly changes the topic. Ported to Kodama from the pack of the paper
  ''Stale but on Time''; the cases, lead-ins and key facts are unchanged. Voice variant: the final utterance
  is spoken into a live Kodama session and heard through its VAD and Whisper; the lead-in line is what
  Whisper heard of it.'
